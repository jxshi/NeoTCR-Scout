[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "neotcr-scout"
version = "0.1.0"
description = "Evidence-guided neoantigen-specific TCR discovery and prioritization workflow."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NeoTCR-Scout contributors" }]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
workflow = ["typer>=0.12", "pandas>=2", "jinja2>=3.1"]

[project.scripts]
neotcr-scout = "neotcr_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
