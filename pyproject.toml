[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neotcr-scout"
version = "0.1.0"
description = "Rule-based neoantigen-to-TCR discovery workflow platform."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NeoTCR-Scout contributors" }]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neotcr-scout = "neotcr_scout.cli:main"

[tool.setuptools.packages.find]
include = ["neotcr_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
